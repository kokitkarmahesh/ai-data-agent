
[project]
name = "ai-data-agent"
version = "0.1.0"
description = "AI-powered banking analytics using DuckDB"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb",
    "pandas",
    "dbt-core",
    "dbt-duckdb",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_ai_agent"]
